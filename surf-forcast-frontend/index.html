<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Surf Forecast</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🌊 Surf Forecast</h1>
    <label for="spotSelector"><strong>Choose a surf spot:</strong></label>
    <select id="spotSelector"></select>
    <div id="forecast">
      <p><strong>Wave Height:</strong> <span id="waveHeight">Loading...</span></p>
      <p><strong>Swell Height:</strong> <span id="swellHeight">Loading...</span></p>
      <p><strong>Swell Period:</strong> <span id="swellPeriod">Loading...</span></p>
      <p><strong>Swell Direction:</strong> <span id="swellDirection">Loading...</span></p>
      <p><strong>Wind Speed:</strong> <span id="windSpeed">Loading...</span></p>
      <p><strong>Wind Direction:</strong> <span id="windDirection">Loading...</span></p>
      <p><strong>Air Temperature:</strong> <span id="airTemp">Loading...</span></p>
      <p><strong>Water Temperature:</strong> <span id="waterTemp">Loading...</span></p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
